server:
  port: 9006

spring:
  application:
    name: ai-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

# AI 配置 - 硅基流动代理 (MKEAI)
ai:
  # API Key
  api-key: sk-0iL6K6MC3Bio7psh1eYVbfKnJ38169nhWmrSUw6ugpBbRdzi
  # API Base URL
  base-url: https://tb.api.mkeai.com/v1
  # 模型名称 - DeepSeek-V3 快速响应，性价比高
  model: deepseek-v3
  # 超时时间（毫秒）
  timeout: 120000

# 日志配置
logging:
  level:
    root: INFO
    com.cly.aiservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
