        timeout: 3000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1346798520
    url: jdbc:mysql://localhost:3306/doctor-service

  cloud:
    nacos:
      discovery:
        server-addr: http://localhost:8848
