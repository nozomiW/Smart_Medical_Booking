spring:
  application:
    name: doctor-service

  data:
    redis:
      host: localhost
      port: 6379
      password: 1346798520
      lettuce:
        pool:
          max-active: 16
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Redisson 官方格式配置 (将被 RedissonConfig 加载)
