server:
  port: 9002

spring:
  application:
    name: doctor-service

  data:
    redis:
      host: localhost
      port: 6379
      password: 1346798520
      lettuce:
        pool:
          max-active: 32
          max-wait: 5000ms
          max-idle: 16
          min-idle: 8

  # Redisson 官方格式配置 (将被 RedissonConfig 加载)
  redisson:
    config: |
      singleServerConfig:
        address: "redis://localhost:6379"
        password: "1346798520"
        connectionMinimumIdleSize: 8
        idleConnectionTimeout: 10000
        connectTimeout: 10000
        timeout: 3000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1346798520
    url: jdbc:mysql://localhost:3306/doctor-service

  cloud:
    nacos:
      discovery:
        server-addr: http://localhost:8848
rocketmq:
  name-server: localhost:9876
  producer:
    group: "hospital-doctor-group"
mybatis:
  mapper-locations: classpath*:mapper/*.xml

# 日志配置
logging:
  level:
    root: INFO
    com.cly.doctorservice: DEBUG
    com.cly.doctorservice.aspect: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
