server:
  port: 9005
spring:
  application:
    name: pay-service

  cloud:
    nacos:
      discovery:
        server-addr: http://localhost:8848

  data:
    redis:
      host: localhost
      port: 6379
      password: 1346798520
      lettuce:
        pool:
          max-active: 32
          max-wait: 5000ms
          max-idle: 16
          min-idle: 8

  # Redisson 官方格式配置 (将被 RedissonConfig 加载)
  redisson:
    config: |
      singleServerConfig:
        address: "redis://localhost:6379"
        password: "1346798520"
        connectionMinimumIdleSize: 8
        idleConnectionTimeout: 10000
        connectTimeout: 10000
        timeout: 3000

# Redisson 官方 Starter 配置
rocketmq:
  name-server: localhost:9876
  producer:
    group: "hospital-pay-group"

# 日志配置
logging:
  level:
    root: INFO
    com.cly.payservice: DEBUG
    com.cly.payservice.aspect: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
